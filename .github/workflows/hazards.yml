name: Dane o fotoradarach

on:
  schedule:
    - cron: '17 3 * * *'   # codziennie w nocy
  workflow_dispatch: {}     # także ręcznie: zakładka Actions -> Uruchom
  push:                     # po zmianie skryptu uruchamia się sam
    paths: ['tools/build-hazards.mjs', '.github/workflows/hazards.yml']

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Biblioteka do plików XLSX
        run: npm install --no-save xlsx
      - name: Zbuduj pliki (OSM + GITD)
        run: node tools/build-hazards.mjs
      - name: Zapisz zmiany
        run: |
          git config user.name "hazards-bot"
          git config user.email "hazards-bot@users.noreply.github.com"
          git add data/hazards.osm.json data/hazards.gitd.json data/hazards.gitd.report.json 2>/dev/null || git add data/hazards.osm.json data/hazards.gitd.json
          git diff --cached --quiet || (git commit -m "Dane o fotoradarach: aktualizacja" && git push && gh workflow run pages.yml --ref main)
